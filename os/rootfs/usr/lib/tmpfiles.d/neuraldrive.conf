# NeuralDrive state lives under /var, which bootc keeps across upgrades.
d /var/lib/neuraldrive              0750 neuraldrive neuraldrive -
d /var/lib/neuraldrive/home         0700 neuraldrive neuraldrive -
d /var/lib/neuraldrive/models       0750 neuraldrive neuraldrive -
d /var/lib/neuraldrive/config       0750 neuraldrive neuraldrive -
d /var/lib/neuraldrive/tls          0750 neuraldrive neuraldrive -
d /var/lib/neuraldrive/stacks       0750 neuraldrive neuraldrive -
C /var/lib/neuraldrive/config/llama-swap.yaml 0640 neuraldrive neuraldrive - /usr/share/neuraldrive/llama-swap.yaml
# Start the user manager for neuraldrive at boot, so its Quadlet units run.
f /var/lib/systemd/linger/neuraldrive 0644 root root -
